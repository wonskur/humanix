set default=0
set timeout=5

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

menuentry "Humanix GNU/Linux 1.0 (Live)" {
    linux /live/vmlinuz boot=live components hostname=humanix username=humanix quiet splash
    initrd /live/initrd.img
}

menuentry "Humanix GNU/Linux 1.0 (RAM-Only / Ejectable USB - toram)" {
    linux /live/vmlinuz boot=live components hostname=humanix username=humanix toram quiet splash
    initrd /live/initrd.img
}
