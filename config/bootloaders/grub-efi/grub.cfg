set default=0
set timeout=5

# Графический режим
set gfxmode=1920x1080,auto
insmod all_video
insmod gfxterm
insmod png
insmod jpeg
terminal_output gfxterm

# Подключение темы
set theme=/boot/grub/themes/minions/theme.txt
export theme

# Загрузка шрифтов темы
loadfont /boot/grub/themes/minions/retro_gaming_regular_22.pf2
loadfont /boot/grub/themes/minions/terminus_regular_14.pf2

# Меню Live
menuentry "Live system (Humanix OS)" --class humanix --class debian --class gnu-linux --class gnu --class os {
    linux /live/vmlinuz boot=live components quiet splash
    initrd /live/initrd.img
}

menuentry "Live system (Humanix OS - Failsafe)" {
    linux /live/vmlinuz boot=live components memtest noapic noapm nodma nomce nolapic nomodeset nosmp nosplash vga=normal
    initrd /live/initrd.img
}
